<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <h1>🌦️ Weather App</h1>
        <p class="subtitle">Check the current weather of any city</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <p id="errorMessage"></p>
        <div id="loading">Loading...</div>

        <div class="weather-card" id="weatherCard">
            <h2 id="cityName">Delhi</h2>
            <div class="weather-icon">☀️</div>
            <h3 id="temperature">--°C</h3>
            <p id="description">Weather condition</p>

            <div class="weather-details">
                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>
                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>
                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>
            </div>
        </div>

        <footer>
            <p>Made with ❤️ using HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
