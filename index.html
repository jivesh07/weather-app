<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App | Jivesh Kumar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<section class="weather-card">
<header class="header">
<p class="eyebrow">LIVE WEATHER</p>
<h1>🌦️ Weather App</h1>
<p class="subtitle">Search a city to see its current weather.</p>
</header>

<form id="searchForm" class="search-box">
<input id="cityInput" type="text" placeholder="Enter city name..." autocomplete="off" required>
<button type="submit">Search</button>
</form>

<p id="status" class="status" aria-live="polite"></p>

<section id="weather" class="weather hidden" aria-live="polite">
<div class="location">
<h2 id="cityName">--</h2>
<p id="countryName">--</p>
</div>

<div class="main-weather">
<div id="weatherIcon" class="weather-icon">🌤️</div>
<div>
<div class="temperature"><span id="temperature">--</span>°C</div>
<p id="condition">--</p>
</div>
</div>

<div class="details">
<div class="detail"><span>🌡️</span><p>Feels like<strong id="feelsLike">--°C</strong></p></div>
<div class="detail"><span>💧</span><p>Humidity<strong id="humidity">--%</strong></p></div>
<div class="detail"><span>💨</span><p>Wind speed<strong id="windSpeed">-- km/h</strong></p></div>
</div>
</section>

<footer>Powered by Open-Meteo • No API key required</footer>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
